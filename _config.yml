# Jupyter Book config — build with:  jupyter-book build .
title: "FAT10–MAD2 Interface — Agentic Adjudication"
author: "ychen"
logo: ""

# Do NOT auto-execute on build: the LLM stages need DEEPSEEK_API_KEY + network.
# Readers run the cells interactively in Jupyter instead.
execute:
  execute_notebooks: "force"
  allow_errors: true
  timeout: 120

repository:
