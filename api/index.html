<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>蛋白质界面裁决器</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1f2933; --muted:#616e7c; --line:#d9dee4; --accent:#2b6cb0;
          --live:#1b7f4b; --live-bg:#e3f5ea; --cited:#2b6cb0; --cited-bg:#e3eefb; --pending:#616e7c; --pending-bg:#eceff2;
          --warn:#8a5a00; --warn-bg:#fff4d6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161b; --card:#1c222a; --ink:#e6eaee; --muted:#9aa5b1; --line:#2f3844; --accent:#7ab0f0;
            --live:#6fdc9c; --live-bg:#173a28; --cited:#8ec0ff; --cited-bg:#1a2f4a; --pending:#b3bcc6; --pending-bg:#2a323c;
            --warn:#f2c46b; --warn-bg:#3a2f12; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:860px; margin:0 auto; padding:24px 16px 64px; }
  header { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  h2 { font-size:1.1rem; margin:0 0 8px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .lang { display:flex; gap:4px; flex-shrink:0; }
  .lang button { padding:4px 10px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:6px; cursor:pointer; font:inherit; font-size:.9rem; }
  .lang button[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  label { display:block; font-weight:600; margin:0 0 6px; }
  select, input { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font:inherit; }
  .tabs { display:flex; gap:8px; margin-bottom:12px; }
  .tabs button { flex:1; padding:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:8px; cursor:pointer; font:inherit; }
  .tabs button[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); font-weight:600; }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .hint { color:var(--muted); font-size:.9rem; margin:6px 0 0; }
  .run { margin-top:14px; padding:10px 22px; background:var(--accent); color:#fff; border:0; border-radius:8px; font:inherit; font-weight:600; cursor:pointer; }
  .run:disabled { opacity:.55; cursor:progress; }
  .notice { background:var(--warn-bg); color:var(--warn); border-radius:8px; padding:10px 12px; margin-bottom:16px; }
  .error { background:#fde8e8; color:#8a1c1c; border-radius:8px; padding:10px 12px; margin-bottom:16px; }
  .headline { font-size:1.15rem; font-weight:600; margin:0 0 8px; }
  ul { margin:6px 0; padding-left:20px; }
  code { font-family:ui-monospace,Consolas,monospace; font-size:.85rem; word-break:break-word; }
  table { width:100%; border-collapse:collapse; font-size:.95rem; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; }
  .badge { display:inline-block; padding:1px 9px; border-radius:99px; font-size:.85rem; font-weight:600; white-space:nowrap; }
  .badge.live { background:var(--live-bg); color:var(--live); }
  .badge.cited { background:var(--cited-bg); color:var(--cited); }
  .badge.pending { background:var(--pending-bg); color:var(--pending); }
  .timeline { list-style:none; margin:0; padding:0; }
  .timeline li { padding:8px 0; border-bottom:1px solid var(--line); }
  .timeline li:last-child { border-bottom:0; }
  .timeline .args { color:var(--muted); font-size:.85rem; font-family:ui-monospace,Consolas,monospace; }
  .timeline .excerpt { margin:6px 0 0; padding-left:10px; border-left:3px solid var(--line); color:var(--muted); font-size:.9rem; }
  .timeline .badge { margin-left:4px; }
  .legend { color:var(--muted); font-size:.9rem; margin-top:10px; }
  .usage { display:flex; flex-wrap:wrap; gap:8px 24px; }
  .usage b { display:block; font-size:1.1rem; }
  details { margin-top:8px; }
  details summary { cursor:pointer; color:var(--accent); }
  details h3 { font-size:.95rem; margin:10px 0 4px; }
  [hidden] { display:none !important; }
  @media (max-width:560px) { .pair { grid-template-columns:1fr; } header { flex-direction:column; } }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1 data-i18n="title">蛋白质界面裁决器</h1>
      <p class="sub" data-i18n="subtitle"></p>
    </div>
    <div class="lang" role="group" aria-label="Language / 语言">
      <button type="button" id="lang-zh" aria-pressed="true">中文</button>
      <button type="button" id="lang-en" aria-pressed="false">English</button>
    </div>
  </header>

  <div id="nokey" class="notice" data-i18n="nokey" hidden></div>

  <section class="card">
    <div class="tabs" role="group">
      <button type="button" id="tab-preset" aria-pressed="true" data-i18n="tab_preset"></button>
      <button type="button" id="tab-custom" aria-pressed="false" data-i18n="tab_custom"></button>
    </div>
    <div id="preset-box">
      <label for="preset" data-i18n="preset_label"></label>
      <select id="preset"></select>
      <p class="hint" data-i18n="preset_hint"></p>
    </div>
    <div id="custom-box" hidden>
      <div class="pair">
        <div><label for="acc-a" data-i18n="acc_a"></label><input id="acc-a" data-i18n-ph="acc_ph" autocomplete="off"></div>
        <div><label for="acc-b" data-i18n="acc_b"></label><input id="acc-b" data-i18n-ph="acc_ph" autocomplete="off"></div>
      </div>
      <p class="hint" data-i18n="custom_hint"></p>
    </div>
    <button class="run" id="run" type="button" data-i18n="run"></button>
    <p class="hint" id="wait" data-i18n="wait" hidden></p>
  </section>

  <section class="card" id="timeline-box" hidden>
    <h2 data-i18n="h_timeline"></h2>
    <ol id="timeline" class="timeline"></ol>
  </section>

  <div id="error" class="error" hidden></div>

  <div id="result" hidden>
    <section class="card">
      <h2 data-i18n="h_conclusion"></h2>
      <p class="headline" id="headline"></p>
      <ul id="points"></ul>
      <div id="flags-box" hidden><strong data-i18n="h_flags"></strong><ul id="flags"></ul>
        <p class="hint" id="flags-hint" data-i18n="flags_hint" hidden></p></div>
      <p class="hint" id="caveat"></p>
      <details id="tech-box" hidden>
        <summary data-i18n="tech"></summary>
        <div id="tech-basis-box" hidden><h3 data-i18n="tech_basis"></h3><ul id="tech-basis"></ul></div>
        <div id="tech-flags-box" hidden><h3 data-i18n="tech_flags"></h3><ul id="tech-flags"></ul></div>
        <div id="tech-details-box" hidden><h3 data-i18n="tech_details"></h3><p id="tech-details"></p></div>
      </details>
    </section>

    <section class="card">
      <h2 data-i18n="h_evidence"></h2>
      <table>
        <thead><tr><th data-i18n="th_item"></th><th data-i18n="th_detail"></th><th data-i18n="th_source"></th></tr></thead>
        <tbody id="evidence"></tbody>
      </table>
      <p class="legend">
        <span class="badge live" data-i18n="live"></span> <span data-i18n="legend_live"></span> &nbsp;
        <span class="badge cited" data-i18n="cited"></span> <span data-i18n="legend_cited"></span> &nbsp;
        <span class="badge pending" data-i18n="pending"></span> <span data-i18n="legend_pending"></span></p>
    </section>

    <section class="card">
      <h2 data-i18n="h_usage"></h2>
      <div class="usage" id="usage"></div>
      <p class="hint" id="price-note"></p>
      <details><summary data-i18n="steps"></summary><ol id="steps"></ol></details>
    </section>
  </div>
</main>

<script>
(function () {
  var I18N = {
    zh: {
      title: "蛋白质界面裁决器",
      subtitle: "查一查两个蛋白在哪里结合。系统会去查真实数据、对照文献,并说明每条证据从哪来。它不做实验,也不会编造数据。",
      nokey: "服务器还没有配置模型密钥(DEEPSEEK_API_KEY),现在无法运行查询。",
      tab_preset: "选一个示例", tab_custom: "输入一对蛋白",
      preset_label: "示例",
      preset_hint: "FAT10–MAD2 是本项目的研究案例;其余是已有实验结构的经典蛋白对(系统看不到它们的实验结构)。",
      case_study: "(研究案例)",
      acc_a: "蛋白 A 的 UniProt 号", acc_b: "蛋白 B 的 UniProt 号", acc_ph: "输入 UniProt 号",
      custom_hint: "UniProt 号可以在 uniprot.org 上查到。自己输入的蛋白对没有分子动力学数据,标为“待定”。",
      h_timeline: "它现在在做什么",
      excerpt_note: "(模型的原话,未翻译)",
      run: "运行", wait: "正在查证据,通常需要一分钟左右,请不要关闭页面……",
      failed: "没有成功:",
      err_400: "服务器还没有配置模型密钥,无法运行查询。",
      err_422: "输入不正确:请选择一个示例,或输入两个有效的 UniProt 号。",
      err_502: "这次查询没有成功(上游的模型或数据服务出错),请稍后再试。",
      err_other: "出现了未预料的错误。",
      h_conclusion: "结论", h_flags: "需要留意", tech: "技术细节",
      flags_hint: "前面几条是程序根据工具的输出直接算出来的;其余是模型对系统原始标记的通俗改写(可能不完美,数字已核对一致),原文见“技术细节”。",
      tech_basis: "上面直接算出的几条,依据是",
      tech_flags: "系统给出的原始标记", tech_details: "系统的详细说明(原文)",
      h_evidence: "证据", th_item: "内容", th_detail: "细节", th_source: "来源类型",
      live: "实时", cited: "引用", pending: "待定",
      legend_live: "本次查询里真实取得或读取的数据",
      legend_cited: "已发表的结论或已核实的快照,不是现在重新算的",
      legend_pending: "没有数据,不会用数字凑数",
      h_usage: "本次查询", steps: "系统调用了哪些工具",
      s_time: "耗时", s_cost: "费用", s_calls: "模型调用", s_dbs: "访问的数据库", s_api: "数据接口调用", s_rec: "处理的记录",
      u_sec: " 秒", u_times: " 次", u_dbs: " 个", u_rec: " 条", unrecorded: "未记录",
      price_note: function (d) { return "费用按第三方价格表估算(价格核对日期 " + (d || "未知") + "),不是账单。"; }
    },
    en: {
      title: "Protein Interface Adjudicator",
      subtitle: "Find out where two proteins bind. The system fetches real data, compares it with the literature, and says where each piece of evidence came from. It runs no experiments and never makes up data.",
      nokey: "The server has no model key (DEEPSEEK_API_KEY) configured, so queries cannot run right now.",
      tab_preset: "Pick an example", tab_custom: "Enter a protein pair",
      preset_label: "Example",
      preset_hint: "FAT10–MAD2 is this project's case study; the others are classic protein pairs with experimental structures (the system cannot see those structures).",
      case_study: " (case study)",
      acc_a: "UniProt accession of protein A", acc_b: "UniProt accession of protein B", acc_ph: "Enter a UniProt accession",
      custom_hint: "You can look up UniProt accessions on uniprot.org. A pair you enter has no molecular-dynamics data, so that evidence is marked “pending”.",
      h_timeline: "What it is doing right now",
      excerpt_note: "(the model's own words, not translated)",
      run: "Run", wait: "Gathering evidence. This usually takes about a minute; please keep the page open…",
      failed: "It did not work: ",
      err_400: "The server has no model key configured, so the query cannot run.",
      err_422: "Invalid input: pick an example, or enter two valid UniProt accessions.",
      err_502: "The query failed (an upstream model or data service returned an error). Please try again later.",
      err_other: "An unexpected error occurred.",
      h_conclusion: "Conclusion", h_flags: "Points to watch", tech: "Technical details",
      flags_hint: "The first items are computed directly from the tools' outputs; the rest are the model's plain-language rewording of the system's raw flags (may be imperfect; the numbers were checked to match). Original wording is under “Technical details”.",
      tech_basis: "What the directly computed items above are based on",
      tech_flags: "Raw flags from the system", tech_details: "The system's detailed explanation (original wording)",
      h_evidence: "Evidence", th_item: "Item", th_detail: "Detail", th_source: "Source type",
      live: "Live", cited: "Cited", pending: "Pending",
      legend_live: "real data fetched or read during this query",
      legend_cited: "a published result or a verified snapshot, not recomputed now",
      legend_pending: "no data; never filled in with a number",
      h_usage: "This query", steps: "Which tools the system called",
      s_time: "Time", s_cost: "Cost", s_calls: "Model calls", s_dbs: "Databases reached", s_api: "Data API calls", s_rec: "Records processed",
      u_sec: " s", u_times: "", u_dbs: "", u_rec: "", unrecorded: "not recorded",
      price_note: function (d) { return "Cost is estimated from a third-party price list (prices last checked " + (d || "unknown") + "); it is not a bill."; }
    }
  };
  var $ = function (id) { return document.getElementById(id); };
  var lang = "zh", mode = "preset", last = null, cases = [], lastErr = null;
  var t = function (k) { return I18N[lang][k]; };
  var pick = function (o) { return o && typeof o === "object" ? o[lang] : o; };

  function fill(id, items) {
    var el = $(id); el.textContent = "";
    items.forEach(function (s) { var li = document.createElement("li"); li.textContent = s; el.appendChild(li); });
  }
  function fillCode(id, items) {
    var el = $(id); el.textContent = "";
    items.forEach(function (s) {
      var li = document.createElement("li"), c = document.createElement("code");
      c.textContent = s; li.appendChild(c); el.appendChild(li);
    });
  }

  function renderPresets() {
    var sel = $("preset"), keep = sel.value;
    sel.textContent = "";
    cases.forEach(function (c) {
      var o = document.createElement("option"); o.value = c.id;
      o.textContent = c.name + (c.kind === "case_study" ? t("case_study") : ""); sel.appendChild(o);
    });
    if (keep) { sel.value = keep; }
  }

  function show(data) {
    var c = data.conclusion;
    $("headline").textContent = pick(c.headline);
    fill("points", c.points.map(pick));
    fill("flags", c.findings.map(function (f) { return pick(f.plain); })
                   .concat(c.flags.map(function (f) { return pick(f.plain); })));
    $("flags-box").hidden = c.findings.length + c.flags.length === 0;
    $("flags-hint").hidden = c.flags.length === 0;
    $("caveat").textContent = pick(c.caveat);

    // raw flag wording and the system's own explanation live under "Technical details"
    fillCode("tech-basis", c.findings.map(function (f) { return f.basis; }));
    $("tech-basis-box").hidden = c.findings.length === 0;
    fillCode("tech-flags", c.flags.map(function (f) { return f.raw; }));
    $("tech-flags-box").hidden = c.flags.length === 0;
    $("tech-details").textContent = c.details || "";
    $("tech-details-box").hidden = !c.details;
    $("tech-box").hidden = c.flags.length === 0 && c.findings.length === 0 && !c.details;

    var tb = $("evidence"); tb.textContent = "";
    data.evidence.forEach(function (r) {
      var tr = document.createElement("tr");
      [pick(r.item), pick(r.detail)].forEach(function (s) { var td = document.createElement("td"); td.textContent = s; tr.appendChild(td); });
      var td = document.createElement("td"), b = document.createElement("span");
      b.className = "badge " + r.label; b.textContent = t(r.label);
      td.appendChild(b); td.appendChild(document.createTextNode(" " + pick(r.source)));
      tr.appendChild(td); tb.appendChild(tr);
    });

    var u = data.usage, box = $("usage"); box.textContent = "";
    function stat(name, val) {
      var d = document.createElement("div"), b = document.createElement("b");
      b.textContent = val; d.appendChild(b); d.appendChild(document.createTextNode(name)); box.appendChild(d);
    }
    stat(t("s_time"), u.seconds == null ? t("unrecorded") : u.seconds.toFixed(1) + t("u_sec"));
    stat(t("s_cost"), u.cost_usd == null ? t("unrecorded") : "$" + u.cost_usd.toFixed(4));
    stat(t("s_calls"), u.llm_calls == null ? t("unrecorded") : u.llm_calls + t("u_times"));
    var a = u.activity;
    if (a) {
      stat(t("s_dbs"), a.databases.length + t("u_dbs"));
      stat(t("s_api"), a.data_api_calls + t("u_times"));
      stat(t("s_rec"), a.records_processed + t("u_rec"));
    }
    $("price-note").textContent = u.cost_usd == null ? "" : t("price_note")(u.pricing_last_checked);
    fill("steps", data.steps.map(function (s) { return s.tool; }));
    $("result").hidden = false;
  }

  var tl = [];
  function renderTimeline() {
    var ol = $("timeline");
    ol.innerHTML = "";
    tl.forEach(function (ev) {
      if (ev.type === "final" || ev.type === "cost") { return; }
      var li = document.createElement("li");
      li.appendChild(document.createTextNode(pick(ev.text)));
      (ev.rows || []).forEach(function (r) {
        var b = document.createElement("span");
        b.className = "badge " + r.label;
        b.textContent = t(r.label);
        li.appendChild(b);
      });
      if (ev.args_summary) {
        var a = document.createElement("div");
        a.className = "args";
        a.textContent = ev.tool + "(" + ev.args_summary + ")";
        li.appendChild(a);
      }
      if (ev.excerpt) {
        var q = document.createElement("p");
        q.className = "excerpt";
        q.textContent = ev.excerpt + " " + t("excerpt_note");
        li.appendChild(q);
      }
      ol.appendChild(li);
    });
    $("timeline-box").hidden = tl.length === 0;
  }

  function handleEvent(ev) {
    tl.push(ev);
    renderTimeline();
    if (ev.type === "final") { last = ev.result; show(ev.result); }
    if (ev.type === "error") { lastErr = { status: 502, detail: "" }; renderError(); }
  }

  // Server-Sent Events over fetch (EventSource cannot read the error body of a 400/422).
  function runStream(qs) {
    return fetch("/api/run/stream?" + qs).then(function (r) {
      if (!r.ok) {
        return r.json().then(function (j) { lastErr = { status: r.status, detail: typeof j.detail === "string" ? j.detail : "" }; renderError(); });
      }
      var reader = r.body.getReader(), dec = new TextDecoder(), buf = "";
      function pump() {
        return reader.read().then(function (x) {
          if (x.done) { return; }
          buf += dec.decode(x.value, { stream: true });
          var i;
          while ((i = buf.indexOf("\n\n")) >= 0) {
            var block = buf.slice(0, i); buf = buf.slice(i + 2);
            var m = /^data: (.*)$/m.exec(block);
            if (m) { handleEvent(JSON.parse(m[1])); }
          }
          return pump();
        });
      }
      return pump();
    });
  }

  function runPlain(body) {
    return fetch("/api/run", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, status: r.status, j: j }; }); })
      .then(function (x) {
        if (!x.ok) { lastErr = { status: x.status, detail: typeof x.j.detail === "string" ? x.j.detail : "" }; renderError(); return; }
        last = x.j; show(x.j);
      });
  }

  function renderError() {
    if (!lastErr) { $("error").hidden = true; return; }
    var key = { 400: "err_400", 422: "err_422", 502: "err_502" }[lastErr.status] || "err_other";
    $("error").textContent = t("failed") + t(key) + (lastErr.detail ? " (" + lastErr.detail + ")" : "");
    $("error").hidden = false;
  }

  function apply() {
    document.documentElement.lang = lang;
    document.title = t("title");
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function (el) { el.textContent = t(el.getAttribute("data-i18n")); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n-ph]"), function (el) { el.placeholder = t(el.getAttribute("data-i18n-ph")); });
    $("lang-zh").setAttribute("aria-pressed", lang === "zh");
    $("lang-en").setAttribute("aria-pressed", lang === "en");
    renderPresets();
    renderError();
    renderTimeline();
    if (last) { show(last); }        // switching language re-renders the same answer; nothing is re-run
  }
  function setLang(l) { lang = l; apply(); }
  $("lang-zh").onclick = function () { setLang("zh"); };
  $("lang-en").onclick = function () { setLang("en"); };

  function setMode(m) {
    mode = m;
    $("tab-preset").setAttribute("aria-pressed", m === "preset");
    $("tab-custom").setAttribute("aria-pressed", m === "custom");
    $("preset-box").hidden = m !== "preset";
    $("custom-box").hidden = m !== "custom";
  }
  $("tab-preset").onclick = function () { setMode("preset"); };
  $("tab-custom").onclick = function () { setMode("custom"); };

  $("run").onclick = function () {
    var body = mode === "preset" ? { case_id: $("preset").value }
                                 : { uniprot_a: $("acc-a").value, uniprot_b: $("acc-b").value };
    lastErr = null; renderError(); $("result").hidden = true; last = null; tl = []; renderTimeline();
    $("wait").hidden = false; $("run").disabled = true;
    var qs = mode === "preset" ? "case_id=" + encodeURIComponent(body.case_id)
                               : "uniprot_a=" + encodeURIComponent(body.uniprot_a) + "&uniprot_b=" + encodeURIComponent(body.uniprot_b);
    var go = (window.ReadableStream && window.TextDecoder) ? runStream(qs) : runPlain(body);   // old browsers: no live view
    go.catch(function () { lastErr = { status: 0, detail: "" }; renderError(); })
      .then(function () { $("wait").hidden = true; $("run").disabled = false; });
  };

  apply();
  fetch("/api/cases").then(function (r) { return r.json(); }).then(function (list) { cases = list; renderPresets(); });
  fetch("/health").then(function (r) { return r.json(); }).then(function (h) { if (!h.llm_configured) { $("nokey").hidden = false; } });
})();
</script>
</body>
</html>
