# Run on the H100. See ../README.md for setup.
model_name_or_path: Qwen/Qwen2-Audio-7B-Instruct
lora_config_path: configs/lora_config.yaml

# Phase 1: MELD manifest produced by scripts/prepare_meld_manifest.py
train_manifest: data/meld_train_manifest.jsonl
eval_manifest: data/meld_dev_manifest.jsonl

output_dir: outputs/meld_lora
num_train_epochs: 3
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
warmup_ratio: 0.03
logging_steps: 10
save_steps: 200
max_target_length: 256
seed: 42
