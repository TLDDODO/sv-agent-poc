# Run on the H100. See ../README.md "ESD" section for setup.
model_name_or_path: Qwen/Qwen2-Audio-7B-Instruct
lora_config_path: configs/lora_config.yaml

# ESD manifest produced by scripts/build_esd_manifest.py, then augmented with real acoustic
# priors by scripts/extract_acoustic_priors.py (adds an 'acoustic' field), mirroring the MELD
# pipeline exactly (see configs/train_config.yaml). Point these at the plain (non-acoustic)
# manifests instead to run the data-level-only baseline: ESD's transcript is already
# uninformative about the label by construction, so that run isolates whether removing the
# shortcut at the data level alone (no acoustic-grounded CoT, no text_mask_prob) is enough to
# stop the model from collapsing onto the (here, useless) transcript -- see RP.md "Hypothesis".
train_manifest: data/esd_train_manifest_acoustic.jsonl
eval_manifest: data/esd_dev_manifest_acoustic.jsonl

output_dir: outputs/esd_lora_grounded
# Same role as in train_config.yaml: fraction of training examples trained audio-only. Keep at
# the same value as the MELD run so the two conditions differ only in corpus, not hyperparameters.
text_mask_prob: 0.3
num_train_epochs: 3
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
warmup_ratio: 0.03
logging_steps: 10
save_steps: 200
max_target_length: 256
seed: 42
