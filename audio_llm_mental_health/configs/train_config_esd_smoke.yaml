# Smoke test: validate the LoRA SFT loop mechanics on a tiny ESD manifest subset before a full
# run. Mirrors configs/train_config_smoke.yaml (MELD) -- see ../README.md "ESD" section.
model_name_or_path: Qwen/Qwen2-Audio-7B-Instruct
lora_config_path: configs/lora_config.yaml

train_manifest: data/esd_train_manifest_smoke.jsonl
eval_manifest: data/esd_dev_manifest_smoke.jsonl

output_dir: outputs/esd_lora_smoke
num_train_epochs: 1
per_device_train_batch_size: 2
gradient_accumulation_steps: 1
learning_rate: 1.0e-4
warmup_ratio: 0.0
logging_steps: 1
save_steps: 1000
max_target_length: 256
seed: 42
