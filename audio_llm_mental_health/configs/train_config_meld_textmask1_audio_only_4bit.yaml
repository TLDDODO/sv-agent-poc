#   python scripts/eval_accuracy.py --adapter outputs/meld_tm1_audio_only/final \
#       --manifest data/meld_dev_manifest.jsonl --sample 200 --seed 42 --audio-only
#   python scripts/eval_accuracy.py --adapter outputs/meld_tm1_audio_only/final \
