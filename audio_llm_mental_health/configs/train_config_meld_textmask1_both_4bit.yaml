# Run on the H100 (1g.10gb MIG slice, 4-bit QLoRA). LoRA-PLACEMENT ATTRIBUTION -- Both arm.
#
# Sibling of the llm_only / audio_only configs. Identical recipe; lora_config_path -> the clean,
# symmetric Both (LLM q/k/v/o + audio q/k/v/out_proj). This is the proper apex of the 3-arm
# comparison and is NOT the same adapter as outputs/meld_lora_textmask1 (that one missed audio
# out_proj). See train_config_meld_textmask1_llm_only_4bit.yaml header and RP.md Future Work.
model_name_or_path: Qwen/Qwen2-Audio-7B-Instruct
lora_config_path: configs/lora_config_both.yaml

train_manifest: data/meld_train_manifest.jsonl
eval_manifest: data/meld_dev_manifest.jsonl

output_dir: outputs/meld_tm1_both
num_train_epochs: 3
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
warmup_ratio: 0.03
logging_steps: 10
save_steps: 200
max_target_length: 256
seed: 42
text_mask_prob: 1.0

# RUNBOOK (run on the H100, AFTER scripts/check_target_modules.py passes):
