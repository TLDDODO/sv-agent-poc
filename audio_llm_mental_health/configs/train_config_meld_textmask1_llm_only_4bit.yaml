# Run on the H100 (1g.10gb MIG slice, 4-bit QLoRA). LoRA-PLACEMENT ATTRIBUTION -- LLM-only arm.
#
# One of three arms (llm_only / audio_only / both) that share THIS exact recipe and differ ONLY in
# lora_config_path -- i.e. only in which tower the rank-16 adapter is allowed to touch. Corpus,
# data, text_mask_prob, optimizer, seed are all identical to train_config_meld_textmask1_4bit.yaml
# (the confound-breaking decoupled cell), so the 3-way comparison isolates "who is responsible for
# using the audio" from everything else. Purpose: RP.md Future Work, the LoRA-placement paragraph.
#
# Read-out across the three arms (all on the --audio-only ruler + the fixed 15-row donor swap):
#   * audio_only grounds, llm_only doesn't  -> the encoding had to change (re-representation)
#   * llm_only grounds, audio_only doesn't  -> info was already in the encoder; LLM re-arbitration
#   * both needed / both ~equal             -> shared responsibility; read the deltas
# This is the causal complement to the training-free probe (which only shows info is linearly
# present, not who exploits it).
model_name_or_path: Qwen/Qwen2-Audio-7B-Instruct
lora_config_path: configs/lora_config_llm_only.yaml

train_manifest: data/meld_train_manifest.jsonl
eval_manifest: data/meld_dev_manifest.jsonl

output_dir: outputs/meld_tm1_llm_only
num_train_epochs: 3
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
warmup_ratio: 0.03
logging_steps: 10
save_steps: 200
max_target_length: 256
seed: 42
text_mask_prob: 1.0

# RUNBOOK (run on the H100, AFTER scripts/check_target_modules.py passes):
#   python scripts/train_lora.py --config configs/train_config_meld_textmask1_llm_only_4bit.yaml
# Then the same pinned in-distribution ruler as the textmask1 cell (--audio-only, seed 42, 200 rows):
#   python scripts/eval_accuracy.py --adapter outputs/meld_tm1_llm_only/final \
#       --manifest data/meld_dev_manifest.jsonl --sample 200 --seed 42 --audio-only
#   python scripts/eval_accuracy.py --adapter outputs/meld_tm1_llm_only/final \
#       --manifest data/meld_dev_manifest.jsonl --sample 200 --seed 42 --audio-only --silence
#   python scripts/audio_ablation.py --adapter outputs/meld_tm1_llm_only/final \
#       --manifest data/meld_dev_manifest.jsonl --audio-only \
#       --indices 228,51,563,501,457,285,209,178,864,65,61,191,447,476,1034 \
#       --out outputs/ablation_meld_tm1_llm_only.jsonl
