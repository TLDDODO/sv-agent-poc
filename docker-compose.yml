services:
  adjudicator:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Pass the key through from your shell / .env; the /evidence + /health
      # endpoints work even when it is empty.
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
    restart: unless-stopped

  # The MCP server (docs/mcp.md), for Claude Desktop / Dify. Same image and code as
  # "adjudicator"; only the command differs. --host 0.0.0.0 is required so the port
  # published below is reachable at all (a container's own 127.0.0.1 is not reachable
  # from outside the container); the published port itself is still bound to the host's
  # 127.0.0.1 only, so it stays off the LAN, matching docs/mcp.md's "localhost only by
  # default". Docker Desktop's host.docker.internal still reaches a host-loopback-only
  # published port (verified: see docs/dify_setup.md, section A1c).
  mcp:
    build: .
    command: ["python", "-m", "mcp_server", "--transport", "http", "--host", "0.0.0.0",
              "--port", "8765", "--allow-host", "host.docker.internal:8765"]
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
    restart: unless-stopped
